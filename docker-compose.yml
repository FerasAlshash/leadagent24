services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leadagent-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8008:8000"
    environment:
      - PORT=8000
    env_file:
      - path: backend/.env
        required: false
    networks:
      - leadagent-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: leadagent-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3050:80"
    depends_on:
      - backend
    networks:
      - leadagent-net

networks:
  leadagent-net:
    name: leadagent-net
    driver: bridge
